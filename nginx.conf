server {
    listen 80;

    # Block AI scrapers and known bad bots, allow search engines
    set $block_bot 0;
    if ($http_user_agent ~* "(GPTBot|ChatGPT-User|Claude-Web|ClaudeBot|anthropic-ai|CCBot|Bytespider|Bytedance|FacebookBot|Meta-ExternalAgent|cohere-ai|PerplexityBot|Applebot-Extended|Diffbot|omgili|Omgilibot|ImagesiftBot|Amazonbot|YouBot|Neevabot|DataForSeoBot|SemrushBot|AhrefsBot|DotBot|MJ12bot|Barkrowler|BLEXBot|ZoominfoBot|TurnitinBot|SISTRIX|SiteAudit|Screaming Frog|PetalBot|YandexBot)") {
        set $block_bot 1;
    }
    if ($http_user_agent ~* "(Googlebot|Google-InspectionTool|Bingbot|Slurp|DuckDuckBot|Baiduspider|Applebot|Yandex|YandexBot)") {
        set $block_bot 0;
    }
    if ($block_bot = 1) {
        return 403;
    }

    root /usr/share/nginx/html;

    location /newrelic {
        alias /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /newrelic/index.html;
    }
}
